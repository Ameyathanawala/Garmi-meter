<style>

:root{--c-blouse:#9F2065;--c-dhoti:#FAF7EF;--c-dupatta:#F0B429;--c-jeans:#3B5C8C;--c-kurta:#F2E3C6;--c-kurta2:#C2416B;--c-lungi:#2F6DA8;--c-salwar:#F7F1E6;--c-saree:#1F8A8A;--c-shawl:#6E4A82;--c-thermal:#DCD5C8;--c-track:#4A4F57;--c-wool1:#8E2B3A;--c-wool2:#C98A1E;--c-wool3:#3D7A72;--concrete:#BEBBB3;--knit:rgba(0,0,0,.24);--leaf:#6FA83A;--nightsky:#0E2233;--trunk:#7A5134}


:root{
  --bg:#FFFCF5; --panel:#FDF6E4; --card:#FFFFFF; --ink:#1D2830; --muted:#5B6870; --line:#E7DDC7; --soft:#F4EDDC;
  --cyan:#26A7E0; --magenta:#9F2065; --green:#8CC63E; --amber:#FBAF41; --orange:#EE7B33; --deep:#6B1043; --cold:#1B78AE;
  --ok:#5E9E22; --warn:#D98A0B; --bad:#B8246E;
  --wall:#F6EEDC; --slab:#E3D7BD; --floor:#E0CFAE; --sky1:#BFE6F7; --sky2:#EAF7FC; --glass:#D6EFFA;
  --skin:#B07A55; --hair:#2B211C; --c-vest:#8CC63E; --c-short:#2E87B8; --c-shirt:#6FC0E8; --c-trouser:#5B6870; --c-sweater:#D9822B; --c-jacket:#1F5E63; --c-scarf:#9F2065; --c-shoe:#3A3230;
  --f-display:"Jost","Century Gothic","Avenir Next","Segoe UI",sans-serif;
  --f-body:"Jost","Century Gothic","Avenir Next","Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:14px;
}



@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:skewX(0)}50%{transform:skewX(-7deg)}}
@keyframes driftL{from{transform:translateX(30px);opacity:0}30%{opacity:.9}to{transform:translateX(-70px);opacity:0}}
@keyframes driftL{from{transform:translateX(30px);opacity:0}30%{opacity:.9}to{transform:translateX(-70px);opacity:0}}
@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(18px);opacity:0}}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes shiver{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.2px)}75%{transform:translateX(1.2px)}}
@keyframes rays{to{transform:rotate(45deg)}}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.spinning{animation:spin var(--dur,1s) linear infinite}.fanico{transform-origin:22px 19px;animation:spin 1.2s linear infinite}





*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Jost,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:var(--card);padding:8px;z-index:9}
h1{font-size:25px;margin:0;font-weight:600}
.tag{color:var(--mute);margin:2px 0 14px;font-size:15px}
.sec{border-top:1px solid var(--rule);padding:14px 0 8px}
.lab{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--mute);margin:0 0 9px;font-weight:500}
.q{font-size:14px;color:var(--mute);margin:10px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:var(--card);padding:8px 12px;min-height:44px;border-radius:4px;cursor:pointer;font-size:14.5px;line-height:1.2}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{border-color:var(--sel);box-shadow:inset 0 0 0 1px var(--sel);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{border:1px solid var(--rule);background:var(--card);padding:9px 4px;border-radius:4px;cursor:pointer;text-align:center;font-size:14px;min-height:64px}
.tile svg{display:block;margin:0 auto 3px}
.tile[aria-checked="true"]{border-color:var(--sel);box-shadow:inset 0 0 0 1px var(--sel);font-weight:600}
input[type=text],input[type=number],select{background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:9px 10px;width:100%;min-height:44px}
.row{display:flex;gap:8px;align-items:center}
.res{list-style:none;margin:6px 0 0;padding:0;border:1px solid var(--rule);border-radius:4px;max-height:200px;overflow:auto;background:var(--card)}
.res li button{display:block;width:100%;text-align:left;padding:10px;border:0;background:none;cursor:pointer;font-size:14.5px}
.res li button:hover,.res li button:focus{background:var(--plate)}
.small{font-size:13.5px;color:var(--mute)}
details>summary{cursor:pointer;color:var(--acc);font-size:14.5px;padding:8px 0;min-height:44px;display:flex;align-items:center}
.sl{display:grid;grid-template-columns:96px 1fr 64px;gap:8px;align-items:center;font-size:14px;margin-top:6px}
input[type=range]{width:100%;accent-color:var(--acc);min-height:32px}
.knobwrap{display:flex;gap:14px;align-items:center}
#knob{touch-action:none;cursor:grab}
.ward{background:#8C6440;border-radius:6px;padding:8px 8px 6px;position:relative}
.rail{height:4px;background:#d9d2c3;border-radius:2px;position:absolute;left:10px;right:10px;top:12px}
.hangers{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;position:relative}
.hg{background:#F3E8D3;border:0;border-radius:4px;padding:4px 2px 6px;cursor:pointer;font-size:12.5px;color:#2b2522;line-height:1.2;min-height:64px}
.hg svg{display:block;margin:0 auto}
.hg[aria-checked="true"]{box-shadow:0 0 0 2px #FFFCF5,0 0 0 4px var(--sel);font-weight:600}
.chars{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.ch{border:1px solid var(--rule);background:var(--card);border-radius:4px;padding:4px 0 3px;cursor:pointer;font-size:11.5px;line-height:1.15;min-height:64px}
.ch[aria-checked="true"]{border-color:var(--sel);box-shadow:inset 0 0 0 1px var(--sel);font-weight:600}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--rule);cursor:pointer;padding:0}
.sw[aria-checked="true"]{box-shadow:0 0 0 3px var(--sel)}
.world{width:100%;height:auto;max-height:300px;display:block;border-radius:6px;margin-bottom:16px}
/* result */
.action{border-radius:6px;padding:16px 18px;margin-bottom:14px;display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;background:var(--c0bg);border-left:6px solid var(--c0)}
.action .ico{width:40px;height:40px}
.cat{font-size:13px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700}
.do{font-size:24px;line-height:1.25;font-weight:600;margin:2px 0 4px}
.limit{font-size:17px}
.limit b{font-size:20px}
.caveat{font-size:14.5px;color:var(--mute);margin-top:6px}
h2{font-size:14px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mute);font-weight:600;margin:26px 0 8px}
ul.plain{margin:0;padding-left:20px}ul.plain li{margin:4px 0}
.lever{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--rule)}
.lever .gain{font-weight:600;text-align:right}
.lever .why{font-size:13.5px;color:var(--mute)}
.house{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.hm{text-align:center;font-size:13px;border-top:4px solid var(--c0);padding-top:6px}
.hm b{display:block;font-size:14.5px}
.strip{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;margin-top:6px}
.cell{height:30px;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:#fff}
.hrs{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;font-size:10.5px;color:var(--mute);text-align:center}
.key{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--mute);margin-top:8px}
.key i{display:inline-block;width:14px;height:14px;border-radius:2px;margin-right:5px;vertical-align:-2px;color:#fff;font-style:normal;font-size:9px;text-align:center;line-height:14px;font-weight:700}
.note{background:var(--plate);border-radius:4px;padding:10px 12px;font-size:14.5px;margin:10px 0}
.exp{border:1px solid var(--rule);border-radius:6px;padding:12px 14px;margin-top:8px}
.emer{background:var(--c3bg);border:2px solid var(--emer);border-radius:6px;padding:16px 18px;margin-bottom:14px}
.emer h2{color:var(--emer);margin-top:0}
.tech{font-size:14.5px}
.tech table{border-collapse:collapse;width:100%;font-size:13.5px;margin:8px 0}
.tech th,.tech td{border-bottom:1px solid var(--rule);padding:5px 6px;text-align:left;vertical-align:top}
.tag2{display:inline-block;font-size:11.5px;border:1px solid var(--rule);border-radius:3px;padding:0 5px;margin-left:4px;color:var(--mute)}
.mobilejump{display:none}
footer{margin-top:36px;font-size:13.5px;color:var(--mute)}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

:root{--wood:#B98B5E;--wood2:#8C6440;--cab-in:#F3E8D3;--rod:#9A8F80;--soft:#F1EADB}

.cv{float:right;font-weight:700;color:var(--ink);letter-spacing:0;text-transform:none;font-size:13px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.quick .chip{font-size:13px;padding:6px 10px}
.cabinet{position:relative;display:grid;grid-template-columns:16px minmax(0,1fr) 16px;border-radius:10px;background:var(--wood);padding:8px 0;box-shadow:inset 0 0 0 2px var(--wood2)}
.doors{display:contents}.door{background:linear-gradient(90deg,var(--wood2),var(--wood));border-radius:8px 0 0 8px;margin:-4px 0;position:relative}
.door.dl{grid-column:1;transform:perspective(300px) rotateY(28deg);transform-origin:left}.door.dr{grid-column:3;transform:perspective(300px) rotateY(-28deg);transform-origin:right;border-radius:0 8px 8px 0;background:linear-gradient(270deg,var(--wood2),var(--wood))}
.door i{position:absolute;top:46%;width:3px;height:22px;border-radius:2px;background:#FBAF41}.door.dl i{right:4px}.door.dr i{left:4px}
.shelves{grid-column:2;background:var(--cab-in);border-radius:6px;padding:2px 8px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.shelf{position:relative;padding-top:12px}.shelf h4{margin:4px 0 2px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600;display:flex;justify-content:space-between;gap:8px}
.shelf h4 em{font-style:normal;letter-spacing:0;text-transform:none;font-weight:400}
.rail2{height:3px;background:var(--rod);border-radius:2px;margin:2px 0 10px}
.hangers2{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.gar{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 3px 6px;border:1.5px solid transparent;border-radius:9px;background:var(--card);cursor:pointer;font-size:11.5px;line-height:1.15;text-align:center;min-height:44px;min-width:0}
.gar::before{content:"";position:absolute;top:-9px;left:50%;width:12px;height:12px;margin-left:-6px;border:2px solid var(--rod);border-bottom:0;border-radius:8px 8px 0 0}
.gar[aria-pressed="true"]{border-color:var(--ink);transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.gar[aria-pressed="true"]::after{content:"\2713";position:absolute;top:3px;right:6px;font-size:11px;font-weight:700;color:var(--c0)}
.gar svg{width:40px;height:40px}.gar small{font-size:10.5px;color:var(--mute)}.gar.dim{opacity:.4}
.clometer{margin:12px 2px 20px}.clotrack{display:flex;height:14px;border-radius:999px;background:var(--soft);overflow:hidden}
.clotrack i{display:block;height:100%;border-right:1.5px solid var(--card)}
.cloticks{position:relative;height:14px;font-size:10.5px;color:var(--mute)}.cloticks span{position:absolute;top:3px;transform:translateX(-50%);white-space:nowrap}.cloticks span:first-child{transform:none}.cloticks span:last-child{transform:translateX(-100%)}
/* visual result blocks */
.frow{display:grid;grid-template-columns:34px minmax(0,1.3fr) minmax(0,1fr);gap:10px;align-items:center;padding:6px 0}
.fic svg,.hic svg,.tic svg,.cic svg{width:30px;height:30px;display:block;color:var(--ink)}
.fbar{height:12px;background:var(--soft);border-radius:6px;overflow:hidden}.fbar i{display:block;height:100%;border-radius:6px}
.flab{font-size:15px}.flab b{font-weight:600}.fnote{font-size:13px;color:var(--mute);margin:4px 0 0 44px}
.hgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hcard{border:1px solid var(--rule);border-radius:8px;padding:12px;background:var(--card);display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 10px}
.hcard.top{border-color:var(--c0);box-shadow:inset 3px 0 0 var(--c0)}
.hcard h3{margin:0;font-size:15.5px;font-weight:600}.hcard p{margin:0;font-size:13px;color:var(--mute)}
.ba{grid-column:1/-1;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 8px;align-items:center;font-size:12.5px;margin-top:6px}
.ba .tr{height:9px;background:var(--soft);border-radius:5px;overflow:hidden}.ba .tr i{display:block;height:100%;border-radius:5px}
.ba b{font-weight:600;white-space:nowrap}
.bodyviz{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
.chart svg{width:100%;height:auto;display:block}
.bt{display:grid;gap:8px}.btile{display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;align-items:center;border:1px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--card)}
.btile b{display:block;font-size:17px}.btile span{font-size:12.5px;color:var(--mute)}
.tiles6{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.t6{border:1px solid var(--rule);border-radius:8px;padding:10px 12px;background:var(--card);display:grid;grid-template-columns:32px minmax(0,1fr);gap:2px 10px;align-items:start}
.t6 .v{font-size:21px;font-weight:600;line-height:1.1}.t6 .k{font-size:12.5px;color:var(--mute)}.t6 .tag2{margin:3px 0 0}
.ucat{display:inline-block;color:#fff;border-radius:3px;padding:0 6px;font-size:11.5px;font-weight:600;margin-top:3px}
.care{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
@media (max-width:880px){.hgrid,.bodyviz{grid-template-columns:1fr}.tiles6{grid-template-columns:repeat(2,minmax(0,1fr))}.frow{grid-template-columns:30px minmax(0,1fr) 34%}}
@keyframes fidget{0%,100%{transform:translateX(0)}25%{transform:translateX(-2.5px) rotate(-.6deg)}75%{transform:translateX(2.5px) rotate(.6deg)}}
#pwrap{transform-box:fill-box;transform-origin:50% 100%}#pwrap.rest1{animation:fidget 1.6s ease-in-out infinite}#pwrap.rest2{animation:fidget .7s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ================= v11 visual system =================
   dusk (default): deep indigo night with glowing, flat illustration colours; day: pale lavender for bright light.
   One loud element per column: the scene (middle) and the bubbles (right). Everything else is quiet. */
:root{--hd:64px;
 --bg:#1C1F45;--bg2:#212553;--card:#2A2E63;--card2:#353A75;--ink:#F5F3FF;--mute:#B4B8E2;--rule:#3C4285;--soft:#3A3F7C;--plate:#30356F;--plate-edge:#4A5097;
 --acc:#FFB547;--onacc:#1C1F45;--sel:#FFB547;
 --c0:#7FD35A;--c1:#FFC94A;--c2:#FF9A52;--c3:#FF8AAB;--c0bg:#32415D;--c1bg:#43405B;--c2bg:#43395C;--c3bg:#433768;--emer:#FF8AAB;--cellink:#1C1F45;
 --o:#C4501A;--g:#2E7D3A;--p:#B8336A;--y:#E3A21A;--l:#5F4BC8;--cy:#1873A8;--r:#BE2F4E;--sl:#565DB0;
 --wood:#8C6440;--wood2:#6B4A2E;--cab-in:#F3E8D3;--rod:#9A8F80;color-scheme:dark}
:root[data-theme="day"]{--bg:#F2F0FA;--bg2:#E9E6F6;--card:#FFFFFF;--card2:#EFEDF9;--ink:#1C1F45;--mute:#565B86;--rule:#D9D5EE;--soft:#E6E3F5;--plate:#ECE9F7;--plate-edge:#D3CFEA;
 --acc:#3B3F8F;--onacc:#FFFFFF;--sel:#3B3F8F;
 --c0:#2A7330;--c1:#8A5A00;--c2:#B4461A;--c3:#B0144F;--c0bg:#E3F3E4;--c1bg:#FFF0D2;--c2bg:#FFE5D8;--c3bg:#FCE0EA;--emer:#B0144F;--cellink:#FFFFFF;
 --wood:#B98B5E;--wood2:#8C6440;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Jost,Mukta,system-ui,sans-serif;transition:background-color .4s}
html[lang="hi"] body{font-family:Mukta,Jost,system-ui,sans-serif;line-height:1.55}
html[lang="te"] body{font-family:"Noto Sans Telugu",Jost,system-ui,sans-serif;line-height:1.6}
html[lang="hi"] .lab,html[lang="hi"] .cat,html[lang="hi"] h2,html[lang="hi"] .shelf h4,html[lang="te"] .lab,html[lang="te"] .cat,html[lang="te"] h2,html[lang="te"] .shelf h4{letter-spacing:0}
:root:not([data-theme="day"]) body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
 background-image:radial-gradient(1.4px 1.4px at 8% 22%,#fff 50%,transparent 52%),radial-gradient(1px 1px at 18% 70%,#fff 50%,transparent 52%),radial-gradient(1.2px 1.2px at 33% 12%,#fff 50%,transparent 52%),radial-gradient(1px 1px at 47% 88%,#fff 50%,transparent 52%),radial-gradient(1.6px 1.6px at 61% 30%,#FFE6B0 50%,transparent 52%),radial-gradient(1px 1px at 74% 64%,#fff 50%,transparent 52%),radial-gradient(1.3px 1.3px at 86% 16%,#fff 50%,transparent 52%),radial-gradient(1px 1px at 93% 78%,#fff 50%,transparent 52%),radial-gradient(1.1px 1.1px at 55% 52%,#fff 50%,transparent 52%),radial-gradient(1px 1px at 26% 44%,#fff 50%,transparent 52%)}
button,input,select{font:inherit;color:inherit}a{color:var(--acc)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h2{font-size:20px;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:600;margin:22px 0 10px}
.lab{text-transform:none;letter-spacing:0;font-size:14px;font-weight:600;color:var(--mute);margin:14px 0 8px}
.q{font-size:14px;color:var(--mute);margin:12px 0 6px}.small{font-size:13.5px;color:var(--mute)}
/* illustrations keep their own light palette in both themes */
.world,.avprev,.family,.ldscene,.hm svg,.ch svg{--card:#FFFFFF;--ink:#1D2830;--line:#E7DDC7;--muted:#5B6870}
.cabinet{--card:#FFFDF8;--ink:#1D2830;--mute:#5A6268;--line:#D9CFBA;--soft:#F1EADB;color:#1D2830}
/* header */
.hdr{position:sticky;top:0;z-index:6;height:var(--hd);display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:none}
.brand .logo .rays{transform-box:fill-box;transform-origin:center;transition:transform .8s}.brand:hover .logo .rays{transform:rotate(45deg)}
.wm b{font-size:22px;font-weight:600;display:block;line-height:1.05}.wm span{font-family:Mukta,Jost,sans-serif;font-size:14px;color:var(--c2);font-weight:600;line-height:1.1;display:block}
.tools{display:flex;gap:8px;align-items:center;margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--card);border-radius:999px;padding:6px 16px 6px 12px;min-height:44px;cursor:pointer;font-size:15px;color:var(--ink)}
.pill svg{color:#FF8A5C}.pill:hover,.iconbtn:hover{background:var(--card2)}
.lang{display:inline-flex;background:var(--card);border-radius:999px;padding:3px}.lang button{border:0;background:none;padding:4px 13px;min-height:38px;border-radius:999px;cursor:pointer;font-size:14.5px;color:var(--ink)}

.ldsteps li.act{color:var(--ink)}.ldsteps li.act::before{border-color:var(--acc);border-top-color:transparent;animation:spin .8s linear infinite}
.ldsteps li.done{color:var(--ink)}.ldsteps li.done::before{background:var(--c0);border-color:var(--c0)}
.ldbar{height:6px;background:var(--soft);border-radius:3px;max-width:360px;margin:10px auto 0;overflow:hidden}.ldbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FBAF41,#E8622C);transition:width .5s}
.fact{max-width:540px;margin:18px auto 0;background:var(--card);border-radius:22px;padding:14px 18px;min-height:124px;text-align:left;transition:opacity .35s;box-shadow:inset 5px 0 0 #FBAF41}
.fact.fade{opacity:0}.fact .lab{margin:0 0 4px}.fact .ft{font-size:17px;margin:0;line-height:1.45}.fact .src{font-size:12.5px;color:var(--mute);margin:6px 0 0}
/* tablet: two columns, details under the result */
@media (max-width:1200px){.app{grid-template-columns:320px minmax(0,1fr);height:auto}.panel{grid-row:1/span 2;position:sticky;top:var(--hd);height:calc(100vh - var(--hd));align-self:start}
 .mid{grid-column:2;overflow:visible;padding:14px 28px 8px}.side{grid-column:2;overflow:visible}.sidein{position:static;overflow:visible;padding:8px 28px 40px}
 .sheet{position:static;transform:none;opacity:1;padding:0 28px 40px;overflow:visible;background:none}.side.sheeton .sidein{display:none}.sheethd{top:var(--hd)}}
/* phone: one column, sheet slides up from the bottom */
@media (max-width:880px){.app{display:flex;flex-direction:column}.mid{order:1;padding:10px 14px 4px}.side{order:2}.sidein{padding:6px 12px 24px}
 .panel{order:3;position:static;height:auto;overflow:visible;border-radius:28px 28px 0 0;padding:10px 12px 24px}
 .hdr{padding:0 12px;gap:8px}.wm span{display:none}.pill .pt{max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .verdict{grid-template-columns:104px minmax(0,1fr);padding:14px 16px;gap:4px 14px}.ring{width:104px;height:104px}.rin b{font-size:27px}.rin b.txt{font-size:15px}.rin em{font-size:13px}.rin span{font-size:10.5px;max-width:74px}.verdict .do{font-size:20px}
 .mobilejump{display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin:12px auto 0;padding:6px 18px;border-radius:999px;background:var(--card);color:var(--ink);text-decoration:none;font-weight:600}
 .bub{--sz:106px}.bub.fill{--sz:148px}.bub.small{--sz:92px}.bub .bt{font-size:15px}.bub.fill .bt{font-size:17px}
 .sheet{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:88vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:0 16px 28px;background:var(--bg);transform:translateY(100%);opacity:1;z-index:40;box-shadow:0 -20px 50px rgba(0,0,0,.45)}
 .sheet.open{transform:none}.side.sheeton .sidein{display:block}.sheethd{top:0}
 #sheetBg{display:block;position:fixed;inset:0;background:rgba(10,12,30,.55);z-index:39;opacity:0;pointer-events:none;transition:opacity .25s}.side.sheeton #sheetBg{opacity:1;pointer-events:auto}
 .house{grid-template-columns:repeat(3,1fr)}.strip .cell{font-size:0}.avgrid{grid-template-columns:1fr}.avprev{height:220px}.wmbig{font-size:38px}.wmbig span{font-size:26px}.obh{font-size:24px}}

/* WHY: each factor is a counterfactual run of the same model; bar = share of the extra strain it causes. Returns the top factor. */
function renderWhy(st){ const box=$("why"); box.textContent=""; const {env,b}=st; if(!b) return null; const F=[], p=point(S.hi);
  const tryF=(ic,label,o,cond,short)=>{ if(!cond) return; const e=o.env||env; if(!e||e.unavailable) return; const b1=runBody(e,o); if(!b1||!meaningful(b,b1)) return; F.push({ic,label,d:score(b1)-score(b),b1,short:short||label}); }; /* d: gain if this factor were removed */
  if(S.where!=="in") tryF("sun",t("why_sun"),{env:M9.envOutdoor(p,"shade",S.surround)},S.where==="sun",t("ws_sun"));
  else tryF("wall",t("why_wall"),{tr:env.tdb},env.tr-env.tdb>1,t("ws_wall"));
  tryF("thermo",t("why_air",env.tdb.toFixed(0)),{env:{...env,tdb:env.tdb-5,tr:env.tr-5}},env.tdb>=30,t("ws_air"));
  tryF(actIcon(),ACTS.find(a=>a[0]===S.act)[1],{act:"sit"},M9.ACT[S.act].met>1.0);
  tryF("drop",t("why_hum",Math.round(env.rh)),{rh:35},env.rh>50,t("ws_hum"));
  tryF("shirt",t("why_clo"),{clo:0.3},clo()>0.5,t("ws_clo"));
  tryF(S.where==="in"?"fan":"wind",t("why_still"),{v:1.2},env.v<0.5&&env.tdb<36,t("ws_still"));
  F.sort((a,c)=>c.d-a.d); const mx=F.length?F[0].d:1;
  if(!F.length) box.appendChild(mk("p",{class:"small"},t("why_none")));
  F.slice(0,5).forEach((f,i)=>{ const r=mk("div",{class:"frow"}); const ic=mk("span",{class:"fic"}); ic.appendChild(icn(f.ic)); r.appendChild(ic);
    const l=mk("span",{class:"flab"}); l.appendChild(i===0?mk("b",null,f.label):document.createTextNode(f.label)); if(i===0) l.appendChild(mk("span",{class:"tag2"},t("why_big"))); r.appendChild(l);
    const bar=mk("span",{class:"fbar",role:"img","aria-label":t("why_aria",f.label,Math.round(f.d/mx*100))}); bar.appendChild(mk("i",{style:`width:${Math.max(6,f.d/mx*100)}%;background:${CATS[Math.max(1,st.cat)].c}`})); r.appendChild(bar); box.appendChild(r); });
  if(S.where!=="in") box.appendChild(mk("p",{class:"fnote"},t("why_note")));
  return F[0]||null; }

const HICON={shade:"tree",rest:"chair",light:"shirt",layers:"layers",fan5:"fan",cooler:"cooler",ac:"ac",floor:"stairs",indoor:"home",time:"clock"};
function renderHelps(st){ const box=$("helps"); box.textContent=""; const {env,b}=st; if(!b){ $("helpsnote").textContent=""; return null; } const Lh=[], p=point(S.hi);
  const tryI=(k,label,how,e,o,short)=>{ if(!e||e.unavailable) return; const b1=runBody(e,o||{}); if(!b1) return; Lh.push({k,label,how,d:score(b1)-score(b),b1,short:short||t("hs_"+k)}); };
  if(S.where==="sun") tryI("shade",t("h_shade"),t("hw_shade"),M9.envOutdoor(p,"shade",S.surround));
  if(M9.ACT[S.act].met>1.0) tryI("rest",t("h_rest"),t("hw_rest"),env,{act:"sit"});
  const light=cloOf({top:"tee",bot:"shorts",ens:null,lay:[],feet:"chappal"}); if(clo()>light+0.05) tryI("light",t("h_light"),t("hw_light",light.toFixed(2)),env,{clo:light});
  if(S.outfit.lay.some(id=>G[id].clo>0)) tryI("layers",t("h_layers"),t("hw_layers"),env,{clo:cloOf({...S.outfit,lay:[]})});
  if(S.where==="in"){ if(S.fan<5) tryI("fan5",t("h_fan5"),t("hw_fan5"),{...env,v:M9.FAN_V[5]});
    if(S.fan>0) tryI("fanoff",t("h_fanoff"),t("hw_fanoff"),{...env,v:M9.FAN_V[0]});
    if(WX&&!S.manual&&S.cooling==="none"&&S.tin===null){ tryI("cooler",t("h_cooler"),t("hw_cooler"),indoorEnv({cooling:"cooler"})); tryI("ac",t("h_ac"),t("hw_ac"),indoorEnv({cooling:"ac",acSet:26})); }
    if(WX&&!S.manual&&S.above!=="middle"&&S.tin===null) tryI("floor",t("h_floor"),t("hw_floor"),indoorEnv({floor:"middle"}));
  } else if(WX&&!S.manual){ const ei=indoorEnv(); if(!ei.unavailable) tryI("indoor",t("h_indoor"),t("hw_indoor"),{...ei,v:M9.FAN_V[3]});
    let best=null; for(let k=1;k<24&&WX.i0+k<WX.rows.length;k++){ const q=point(k), h=hm(q.t); if(h<6||h>19||!pointOk(q)) continue; const u=M9.utci(M9.envOutdoor(q,S.where,S.surround)); if(!best||u<best.u) best={k,u,q}; }
    if(best) tryI("time",t("h_time",fmtH(hm(best.q.t))),t("hw_time"),M9.envOutdoor(best.q,S.where,S.surround),{},t("hs_time",fmtH(hm(best.q.t)))); }

    const d=mk("div"); d.appendChild(mk("h3",null,x.label)); d.appendChild(mk("p",null,(i===0?t("h_top"):"")+x.how)); c.appendChild(d); c.appendChild(baBars(b,x.b1)); grid.appendChild(c); });
  if(good.length) box.appendChild(grid); else box.appendChild(mk("p",{class:"small"},t("h_none")));
  const fanOff=Lh.find(x=>x.k==="fanoff"), fanUp=Lh.find(x=>x.k==="fan5");
  let note=t("h_note"); if(fanOff&&meaningful(b,fanOff.b1)) note=t("h_fanhot")+note; if(fanUp&&meaningful(fanUp.b1,b)) note=t("h_fanup")+note;
  /* public-health caution (UKHSA / PHE: fans when below 35 °C), shown alongside the model, not instead of it */
  if(S.where==="in"&&env.tdb>=35) note=t("h_fan35")+note;
  $("helpsnote").textContent=note; return good[0]||null; }
function baBars(b0,b1){ const w=mk("div",{class:"ba"}), kid=isKid(); const row=(lab,frac,txt,col)=>{ if(kid) txt=""; w.appendChild(mk("span",null,lab)); const tr=mk("span",{class:"tr"}); tr.appendChild(mk("i",{style:`width:${Math.max(3,Math.min(100,frac*100))}%;background:${col}`})); w.appendChild(tr); w.appendChild(mk("b",null,txt)); };
  if(kid){ const r=clamp(score(b0)/Math.max(score(b1),1e-6),0,1); row(t("ba_now"),1,"",CATS[2].c); row(t("ba_after"),clamp(r,0.05,1),"",CATS[0].c); w.appendChild(mk("span",{style:"grid-column:1/-1;color:var(--mute)"},t("in_less"))); return w; }

  else { const sc=x=>(x-37)/2.5; row(t("ba_now"),sc(b0.core240),b0.core240.toFixed(1)+" °C",CATS[1].c); row(t("ba_after"),sc(b1.core240),b1.core240.toFixed(1)+" °C",CATS[0].c);

  const X=m=>l+(W-l-r)*m/240, Y=v=>tp+(H-tp-bt)*(1-(v-lo)/(hi-lo)), path=a=>a.map((v,i)=>(i?"L":"M")+X((i+1)*5).toFixed(1)+" "+Y(v).toFixed(1)).join("");

  for(let m=0;m<=240;m+=60) g+=`<text x="${X(m)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--mute)">${m?t("hs",m/60):"0"}</text>`;
  g+=`<line x1="${l}" x2="${W-r}" y1="${Y(38)}" y2="${Y(38)}" stroke="${CATS[3].c}" stroke-width="1.6" stroke-dasharray="5 4"/><text x="${W-r}" y="${Y(38)-5}" text-anchor="end" font-size="11" font-weight="600" fill="${CATS[3].c}">${t("ch_lim")}</text>`;
  if(tj) g+=`<path d="${path(tj)}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-dasharray="4 3"/>`;
  g+=`<path class="curve" d="${path(tr)}" fill="none" stroke="var(--ink)" stroke-width="2.4" pathLength="1"/>`;
  const tl=b.ji?b.tCoreLow:b.tCore; if(tl!==null&&tl<=240) g+=`<line x1="${X(tl)}" x2="${X(tl)}" y1="${tp}" y2="${H-bt}" stroke="${CATS[2].c}" stroke-width="1.4"/><circle cx="${X(tl)}" cy="${Y(38)}" r="4" fill="${CATS[2].c}"/><text x="${X(tl)+5}" y="${tp+10}" font-size="11" fill="${CATS[2].c}">${fmtShort(tl)}</text>`;
  ch.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("ch_aria",tl===null?t("ch_nr"):t("ch_at",fmtShort(tl)))}">${g}</svg>`;
  if(tj){ const lg=mk("p",{class:"chleg"}); lg.innerHTML=`<span><svg width="22" height="8" aria-hidden="true"><line x1="0" x2="22" y1="4" y2="4" stroke="var(--ink)" stroke-width="2.4"/></svg> ${t("ch_jos")}</span><span><svg width="22" height="8" aria-hidden="true"><line x1="0" x2="22" y1="4" y2="4" stroke="var(--acc)" stroke-width="2" stroke-dasharray="4 3"/></svg> Ji et al. 2022</span>`; ch.appendChild(lg); }
  ch.appendChild(mk("p",{class:"small",style:"margin:2px 0 0"},t("ch_cap")));
  const tiles=mk("div",{class:"bt"}); const tile=(k,big,sub)=>{ const d=mk("div",{class:"btile"}); d.appendChild(icn(k)); const x=mk("div"); x.appendChild(mk("b",null,big)); x.appendChild(mk("span",null,sub)); d.appendChild(x); tiles.appendChild(d); };
  tile("drops3",t(b.prodGph>500?"sw3":b.prodGph>200?"sw2":b.prodGph>60?"sw1":"sw0"),t("sw_sub",Math.round(b.prodGph/50)*50));
  const pe=Math.round(b.effEvap*100); const ring=mk("div",{class:"btile"}); const rs=mk("span",{"aria-hidden":"true"}); const C=2*Math.PI*12;
  rs.innerHTML=`<svg viewBox="0 0 32 32" width="30" height="30"><circle cx="16" cy="16" r="12" fill="none" stroke="var(--soft)" stroke-width="5"/><circle cx="16" cy="16" r="12" fill="none" stroke="#26A7E0" stroke-width="5" stroke-dasharray="${C*b.effEvap} ${C}" transform="rotate(-90 16 16)"/></svg>`;
  ring.appendChild(rs); const rx=mk("div"); rx.appendChild(mk("b",null,t("ev",pe))); rx.appendChild(mk("span",null,t(pe<60?"ev_lo":"ev_hi"))); ring.appendChild(rx); tiles.appendChild(ring);
  if(b.tWaterNoDrink!==null) tile("drop",t("wl",fmtShort(b.tWaterNoDrink)),t("wl_sub")); else tile("thermo",t("skt",b.tSk60.toFixed(1)),t("skt_sub"));
  wrap.appendChild(ch); wrap.appendChild(tiles); box.appendChild(wrap);

/* MODELS USED: named model behind every number on the page, with a status from a fixed vocabulary:
   IMPLEMENTED (in the code), VERIFIED (code agrees with an independent reference implementation), VALIDATED (the model itself was
   compared with measurements in published studies), BENCHMARKED (compared with another simulation program), APPROXIMATE (assumed
   or simplified value), NOT MODELLED, GUIDANCE ONLY, UNKNOWN. */
function modelsTable(){ const rows=[
  ["Air temperature, humidity, wind, sunlight","Open-Meteo, four global models (ECMWF IFS 0.25°, NOAA GFS, DWD ICON, UK Met Office; hourly, area average, local time zone of the place); for each hour the model with the highest UTCI for the setting; single best-match forecast if that request fails; a reading entered by the user replaces the forecast for that hour when more stressful; manual mode: solar position for the date and place, Kasten and Young air mass, Meinel clear-sky beam, reduced for haze or cloud","IMPLEMENTED. Forecast-model data, not a station measurement. Most-stressful-model rule: a cautious communication choice. Manual sky factors: APPROXIMATE"],
  ["Wind at body height","Logarithmic profile from 10 m to 1.1 m (z0 0.5 m street, 0.03 m open); no artificial floor. Inside the body models, body movement adds 0.3 (M − 1) m/s for M up to 2 met (ASHRAE 55 / ISO 7730 convention)","IMPLEMENTED. Terrain class and the 2 met cap: APPROXIMATE"],
  ["Mean radiant temperature, outdoors","Air temperature + solar increment from ASHRAE 55 SolarCal, averaged over body orientation, standing; long-wave surroundings taken at air temperature (hot ground and walls, cool sky NOT MODELLED)","VERIFIED vs pythermalcomfort (500 cases, ≤ 5e-8 W/m²). Long-wave part: APPROXIMATE"],
  ["Room air, mean radiant temperature, humidity","Garmi room model v2: transient walls, TARP convection, sky long-wave, window and ventilation network (single-sided in the public set-up), moisture balance; 10 days of past weather for spin-up; unknown details covered by a 16-run balanced design plus predicted extremes","IMPLEMENTED. BENCHMARKED vs EnergyPlus 9.4 (closed rooms). Not yet compared with measured homes (UNKNOWN real-world error)"],
  ["Core temperature, time limit, sweat, wettedness (adults)","JOS-3 thermoregulation model (Takahashi et al. 2021), 17 segments, reference body 1.72 m, 74.4 kg, pythermalcomfort defaults","VERIFIED vs pythermalcomfort (215 of 247 cases identical to 4e-13 °C over 240 min). One deliberate deviation in extreme humid heat (see notes). Model VALIDATED by its authors in laboratory studies"],
  ["Same, 65 and over","JOS-3 age-70 settings and the Ji et al. (2022) older-adult two-node model; the shorter time is shown as a cautious choice","Ji: VERIFIED (400 runs × 240 min, ≤ 7e-15 °C); VALIDATED by its authors (core within 0.3 °C). The pairing and the minimum rule: APPROXIMATE (a cautious envelope, not a measured tolerance)"],
  ["Water-loss limits","Sweat secreted (including dripping) + skin diffusion + breathing water, from JOS-3. With water to drink: 5 % of body mass. Without: 3 %, time × 0.6 (ISO 7933:2023 as coded in pythermalcomfort)","IMPLEMENTED. Criteria from the standard; application to JOS-3 water loss: APPROXIMATE"],
  ["Outdoor heat stress","UTCI operational polynomial (Bröde et al. 2012), 10 m wind 0.5 to 17 m/s","VERIFIED vs pythermalcomfort (3,005 cases, ≤ 3e-11 °C). Used for the surroundings only, never for the time"],
  ["Feels-like temperature","SET* from the Gagge two-node model (ASHRAE 55), with the same relative air speed","VERIFIED vs pythermalcomfort (800 cases, ≤ 4e-12 °C)"],
  ["Heat around the person (bar above the result)","Outdoors: UTCI value and category. Indoors: room air temperature and humidity. SET* bands 25.6, 30, 34.5 and 37.5 °C (Gagge et al. 1986) set the indoor urgency minimum","UTCI and SET* code VERIFIED (above). Band wording: APPROXIMATE"],
  ["Ring when no limit is reached in 4 h","Share of the way to the limit after 4 h: the larger of the core margin (rise from the resting start towards 38 °C) and the water margin (loss towards 5 % of body mass); JOS-3, and Ji for 65+","IMPLEMENTED. A communication measure built from the body model, not a separate physiological index"],
  ["Drinking line","JOS-3 sweat rate at 1 h in glasses of 250 ml an hour, at least 1, at most 4 (NIOSH 2017: no more than about 1.4 litres an hour)","GUIDANCE. Rounding and cap: APPROXIMATE"],
  ["Indoor comfort (technical only)","PMV and PPD (Fanger, ISO 7730), only between 10 and 30 °C","VERIFIED vs pythermalcomfort (1,000 cases, ≤ 0.005)"],
  ["Clothing insulation","ASHRAE 55 garment summation; saree, salwar, dhoti, lungi measured on a thermal manikin (Indraganti et al.); kurta, pyjama, shawl mapped to the nearest table garment","IMPLEMENTED. Mapped garments: APPROXIMATE"],
  ["Activity","ASHRAE 55 metabolic rate table; wheelchair users: same activity, seated posture","IMPLEMENTED"],
  ["Fan","Air speed per regulator step 0.1, 0.3, 0.6, 0.9, 1.2, 1.5 m/s; its effect comes from the body model","APPROXIMATE (archetype, real fans vary)"],
  ["Pregnancy","No model. Advice only (Chersich et al. 2020; Ravanelli et al. 2019)","GUIDANCE ONLY"],
  ["Stressed, anxious, overwhelmed","No model. Separate context panel (Pilcher et al. 2002; Hancock and Vasmatzidis 2003)","GUIDANCE ONLY"],
  ["Health conditions, medicines","No model. Advice only (Kenny et al. 2010)","GUIDANCE ONLY"],
  ["Babies, children","No model. Guidance only, urgency one step above the adult result","GUIDANCE ONLY"],
  ["Warning signs","Override: any ticked sign hides every modelled time and shows emergency steps","IMPLEMENTED"],
  ["Urgency level","Communication rule: under 20 min, under 1 h, under 4 h, not reached; heat around the person sets a minimum: UTCI above 32 / 38 / 46 °C outdoors, SET* above 34.5 / 37.5 °C indoors","IMPLEMENTED. A communication choice, not a physiological threshold"]];
  const t=mk("table"); const hr=mk("tr"); ["What","Model or method","Status"].forEach(h=>hr.appendChild(mk("th",null,h))); t.appendChild(hr);
  rows.forEach(r=>{ const tr=mk("tr"); r.forEach(c=>tr.appendChild(mk("td",null,c))); t.appendChild(tr); }); return t; }

  sec("Models used for every number",[modelsTable()]);
  sec("How the time is found",["The body model runs minute by minute for 4 hours from its own thermoneutral resting state. The time shown is the earliest of: pelvis core (a rectal proxy) reaching 38.0 °C; or total water loss reaching 5 % of body mass for someone who can drink (ISO 7933:2023). The no-drinking water limit (3 %, time × 0.6, as coded in pythermalcomfort) is stated beside the result whenever it is shorter.",
    "38.0 °C is a modelling endpoint, not a medical boundary. WHO (1969) advised against rectal temperatures above 38 °C in prolonged heavy work and ISO 7933 uses it as its rectal limit. It is cautious for healthy, acclimatised adults; it says nothing about heat illness in an individual.",
    "If the limit is not reached within 4 hours, the page says so. It never says the situation is safe.",
    "Warning signs override everything: the modelled time is hidden. Heat around the person sets a minimum urgency level, whatever the body model says, but never sets or shortens the time: outdoors, UTCI above 32, 38 and 46 °C gives at least 'take regular breaks', 'limit your time' and 'act now' (the same bands as the 24-hour strip); indoors, SET* above 34.5 and 37.5 °C ('hot' and 'very hot' in the Gagge et al. 1986 bands) gives at least 'take regular breaks' and 'limit your time'.",
    "Result card (v14): a bar above the result shows the heat around the person, the same for everyone there (UTCI value and category outdoors; room air indoors). The ring is always about the person's own body: the time when a limit is reached within 4 hours, otherwise how far the body gets towards its limit in 4 hours, the larger of the core-temperature margin (rise from the model's resting start towards 38 °C) and the water margin (loss towards 5 % of body mass); for 65+ the Ji model's core margin is included. This replaces '4+ hours' (v12), which people read as 'safe for 4 hours', and the v13 ring that switched to UTCI, which does not change with activity, clothes or age. The colour and the headline follow whichever is worse, and a line says when the surroundings set the colour.",
    "Drinking: the modelled sweat rate at 1 hour is turned into glasses of 250 ml an hour, at least 1 and at most 4 (1 litre an hour). NIOSH (2017) advises a cup every 15 to 20 minutes during work in heat and no more than about 1.4 litres an hour. People whose doctor limits their fluids should follow that advice.",
    "Children and babies: no validated model is used, so there is no time; the urgency is one step above the adult result. Pregnancy, health conditions, medicines and how you feel change the advice only."]);
  sec("Live location (v14)",["'Use my location' asks the browser for the phone's position. Browsers only allow this on secure pages (https or localhost), so a copy opened as a file on a phone usually cannot use it; the page then says so. The position is rounded to 0.01° (about 1 km) before it is sent to the weather service and is not stored."]);
  sec("Weather forecasts (v13)",["Four global forecast models are requested through Open-Meteo: ECMWF IFS 0.25°, NOAA GFS, DWD ICON and the UK Met Office global model. Each gives an average over a grid cell several to 25 kilometres across, so near coasts, hills or dense city centres it can miss local heat by several degrees. For every hour the page uses the model with the highest UTCI for the chosen setting (sun or shade) and shows the spread of air temperature across models. This is a cautious rule: it narrows the chance of missing heat, and can overstate heat when one model runs hot.",
    "A temperature you enter from a weather app or a thermometer is used for that hour when it gives a higher UTCI than the forecasts; otherwise the forecast is kept and the page says so. Without a humidity reading, the forecast's water-vapour pressure is kept, so relative humidity falls as the temperature rises. Phone weather apps are also forecasts, and thermometers in the sun read high.",
    "Indoors, the room model needs one continuous weather history, so it uses the single model with the warmest air over the 24 hours up to the chosen hour, among models with no gaps in their 10-day history. If the multi-model request fails, the page falls back to the single Open-Meteo best-match forecast, as in v12."+(WX&&WX.src==="single"?" This page is using that fallback now.":"")]);
  sec("Things to know about these models",["Resting starting points differ. JOS-3 starts from pelvis core 37.19 °C at age 30, 37.34 °C at age 55 and 37.56 °C at age 70; the Ji model starts at 36.49 °C. With a fixed 38 °C endpoint, much of the shorter time for older age groups comes from the higher starting point of the JOS-3 age-70 settings rather than from weaker cooling alone. The two older-adult numbers are a cautious envelope, not a measured tolerance.",
    "Sensitivity near the endpoint. When the modelled core rises slowly near 38 °C, moving the endpoint by 0.1 °C can move the time by more than 30 minutes (in 247 test runs: median 6 min, 90th percentile 21 to 97 min). The page flags these results and rounds times to 5 or 15 minutes.",
    "Extreme humid heat. When the air's vapour pressure is above the skin's saturation pressure no sweat can evaporate. The reference JOS-3 code (pythermalcomfort 4.6) then produces negative wettedness and spurious cooling (core falling at 43 °C, 75 % humidity). Garmi Meter caps evaporation at zero in that regime; 32 of 247 random test runs reached it, and all other runs are identical to the reference.",
    "Sex: JOS-3 uses sex only in its basal metabolic rate equation; the pythermalcomfort default (male) is used for everyone and gender is not an input. Hair and skin tone are drawn, not modelled.",
    "Rested start: someone already hot, tired, dehydrated, unwell, or coming from work in the heat will reach the limit sooner than shown."]);
  sec("Code verification and benchmarking for this version",[tbl([["JOS-3 port vs pythermalcomfort JOS3 (internal state, unrounded)","247 runs × 240 min: random, dry, humid, shade, sun, high and low air speed, clothing, activity, edge cases; ages 30, 55, 70","215 identical (max 4e-13 °C, time to 38 °C within 6e-11 min); 32 differ only through the documented humid-heat correction"],
    ["Ji older-adult port vs pythermalcomfort","400 runs × 240 min","max 7e-15 °C"],["Gagge two-node SET* vs pythermalcomfort","800 cases","max 4e-12 °C"],["SolarCal vs pythermalcomfort","500 cases","max 5e-8 W/m²"],
    ["UTCI vs pythermalcomfort","3,005 cases incl. range limits","max 3e-11 °C"],["PMV vs pythermalcomfort (ISO 7730)","1,000 cases, 10 to 30 °C","max 0.005"],
    ["Indoor design vs all 128 room combinations","80 cases (4 weathers, 4 hours, 5 knowledge states)","median within 0.41 K, lowest within 0.07 K, highest within 0.82 K"],
    ["Room model v2 vs EnergyPlus 9.4 (benchmarking, not field validation)","30 closed-room runs, 5 climates","air temperature RMSE median 0.45 K (0.22 to 1.33); west-facing middle floors about −1 K bias"],
    ["Room model vs measured homes (validation)","not yet done","planned with the Tasgaonkar et al. (2022) open dataset"]],["Check","Cases","Result"])]);
  sec("Model comparison (why the time is approximate)",["For the same 12 test conditions the Gagge two-node model often gives much shorter adult times than JOS-3 (walking in 40 °C sun: 76 min vs not reached in 4 h), while ISO 7933 PHS predicts no rectal limit within 8 hours in 11 of the 12 for acclimatised workers. JOS-3 was chosen because it is the most detailed published model that runs in a browser and its port reproduces the reference. The spread between models is the largest uncertainty in the headline time."]);
  sec("Uncertainty and limits",["Largest uncertainties: (1) differences between body models and between people (fitness, acclimatisation, health); (2) outdoor long-wave radiation, since hot ground and walls and the cooler sky are not modelled; (3) indoor estimates when room details or a thermometer reading are missing, and the room model's 10-day spin-up (tests show up to about 0.3 K from the starting state); (4) the public room set-up assumes one medium sliding window with insect mesh on one outside wall, so ventilation is single-sided; window type, size and cross-ventilation are not asked.",
    "Weather is forecast-model data for an area several kilometres across, not a street measurement; using the most stressful of several models narrows but does not remove this. Fan air speeds are archetypes. Indoor humidity follows the room model's moisture balance, not cooking or bathing.",

    "Not used: a single combined risk score; WBGT, which would need measured globe and natural wet-bulb temperatures to be meaningful here; adaptive comfort, which describes acceptability rather than safety."]);

  sec("Privacy and data",["Everything is calculated in your browser and nothing you enter is stored (no cookies, no local storage, no analytics). A temperature reading you enter stays in the page. The weather request sends coordinates rounded to 0.01° (about 1 km) to Open-Meteo; a place search sends the typed name to Open-Meteo geocoding. Fonts are loaded from Google Fonts, which receives your IP address. Health, feelings and warning-sign answers never leave the page."]);

/* live location (v14). Browsers share location only with secure pages (https or localhost). A copy opened as a file on a phone
   (content:// or file://) usually cannot ask, so the page says why and points to search and the city list. Coordinates go to the
   weather service rounded to 0.01° (about 1 km), as for any place. */
const HERE="@here";
function getLocation(msgEl,after){ const say=k=>{ msgEl.textContent=t(k); };
  if(!("geolocation" in navigator)){ say("loc_none"); return; }
  if(window.isSecureContext===false){ say("loc_insecure"); return; }
  say("loc_wait");
  navigator.geolocation.getCurrentPosition(p=>{ const la=p.coords.latitude, lo=p.coords.longitude; if(!Number.isFinite(la)||!Number.isFinite(lo)){ say("loc_unavail"); return; }
      setPlace(HERE,la,lo); say("loc_ok"); if(after) after(); },
    e=>{ const file=/^(file|content):$/.test(location.protocol); say(e&&e.code===1?(file?"loc_denied_file":"loc_denied"):e&&e.code===3?"loc_timeout":"loc_unavail"); },
    {enableHighAccuracy:false,timeout:15000,maximumAge:600000}); }
function setPlace(name,lat,lon){ S.place={name,lat,lon}; S.hi=0; S.fix=null; PCACHE.clear(); $("res").classList.add("hide"); $("q").value=""; roomCache.clear(); M9.cache.clear(); syncControls(); return loadWx(); }
function maybeRefresh(){ if(WX&&Date.now()-WX.fetched>60*60e3) loadWx(); }
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) maybeRefresh(); });

/* ---------------- fan regulator knob ---------------- */
const K={cx:75,cy:75,a0:-135,step:54};
function drawKnob(){ const n=S.fan, ang=K.a0+n*K.step; let g=`<rect x="4" y="4" width="142" height="142" rx="14" fill="var(--plate)" stroke="var(--plate-edge)"/>`;
  for(let i=0;i<=5;i++){ const a=(K.a0+i*K.step-90)*Math.PI/180, x=K.cx+58*Math.cos(a), y=K.cy+58*Math.sin(a), x1=K.cx+46*Math.cos(a), y1=K.cy+46*Math.sin(a), x2=K.cx+50*Math.cos(a), y2=K.cy+50*Math.sin(a);
    g+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--mute)" stroke-width="1.5"/><text data-s="${i}" x="${x}" y="${y+4}" text-anchor="middle" font-size="${i?12:10}" font-weight="${i===n?700:500}" fill="${i===n?"var(--acc)":"var(--mute)"}" style="cursor:pointer">${i?i:t("knob_off")}</text>`; }
  const pa=drawKnob.prev??ang; drawKnob.prev=ang; g+=`<g class="knobcap" id="kcap" style="transform:rotate(${pa}deg)"><circle cx="${K.cx}" cy="${K.cy}" r="36" fill="#FFFFFF" stroke="#CFC5B0" stroke-width="2"/><rect x="${K.cx-3}" y="${K.cy-30}" width="6" height="22" rx="3" fill="#D8453B"/></g>`;
  const k=$("knob"); k.innerHTML=g; k.setAttribute("aria-valuenow",n); k.setAttribute("aria-valuetext",n?t("fan_aria",n,M9.FAN_V[n]):t("fan_off"));
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ const c=$("kcap"); if(c) c.style.transform=`rotate(${ang}deg)`; })); $("fanv").textContent=n?t("fan_sp",n):t("fan_off"); $("fans").textContent=n?t("fan_txt",M9.FAN_V[n]):t("fan_still"); }
function setFan(n){ n=clamp(n,0,5); if(n===S.fan) return; S.fan=n; drawKnob(); clearTimeout(setFan.t); setFan.t=setTimeout(render,120); }
function buildKnob(){ const kn=$("knob"); let drag=false;
  const angStep=e=>{ const r=kn.getBoundingClientRect(), x=e.clientX-r.left-r.width/2, y=e.clientY-r.top-r.height/2; let a=Math.atan2(x,-y)*180/Math.PI; a=clamp(a,K.a0,-K.a0); return Math.round((a-K.a0)/K.step); };
  kn.addEventListener("pointerdown",e=>{ const s=e.target.dataset&&e.target.dataset.s; if(s!==undefined){ setFan(+s); return; } drag=true; kn.setPointerCapture(e.pointerId); setFan(angStep(e)); });
  kn.addEventListener("pointermove",e=>{ if(drag) setFan(angStep(e)); }); kn.addEventListener("pointerup",()=>{ drag=false; });
  kn.addEventListener("keydown",e=>{ if(["ArrowUp","ArrowRight"].includes(e.key)){ setFan(S.fan+1); e.preventDefault(); } if(["ArrowDown","ArrowLeft"].includes(e.key)){ setFan(S.fan-1); e.preventDefault(); } if(e.key==="Home"){ setFan(0); e.preventDefault(); } if(e.key==="End"){ setFan(5); e.preventDefault(); } });
  drawKnob(); }
